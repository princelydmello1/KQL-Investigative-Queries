name: Process and parent actions by file hash
description: |
  Query to find all actions performed by a process and its parent based on the file hash observed in an alert on a specific device. 
  This can be useful for a process alert in Defender, since that typically does not include this information. 
  This query can serve as a quick initial check to identify actions performed by a process before moving on to the timeline view, which is more time-consuming but offers richer underlying data. 
  This query can be used to identify actions associated with a suspected file hash that may have been invoked multiple times.
  This query will not return certain event types that are only visible in the Timeline View in Advanced Hunting. 
query:  |
  // Replace <FIXME1> with the file SHA1 to be investigated and <FIXME2> with the defender device id
  let alertSHA1 = <FIXME1>;
  let alertDeviceId = <FIXME2>;
  let ParentProcessSHA1 = 
      DeviceFileEvents
      | where SHA1 == alertSHA1 
          and DeviceId == alertDeviceId
      | summarize by InitiatingProcessSHA1;
  union 
      DeviceProcessEvents,
      DeviceNetworkEvents,
      DeviceFileEvents,
      DeviceRegistryEvents,
      DeviceImageLoadEvents,
      DeviceEvents
  | where DeviceId == alertDeviceId 
      and (InitiatingProcessSHA1 == alertSHA1 or InitiatingProcessSHA1 has_any (ParentProcessSHA1))
  | extend Actor = case(
      InitiatingProcessSHA1 has_any (ParentProcessSHA1), "AlertProcessParent",
      InitiatingProcessSHA1 == alertSHA1, "AlertProcess",
      ""
  )
  | summarize by 
      Actor,
      TimeGenerated,
      ActionType,
      InitiatingProcessAccountName,
      InitiatingProcessFileName,
      InitiatingProcessParentFileName,
      FileName,
      FolderPath,
      RemoteUrl,
      RemoteIP,
      RemotePort,
      LocalIP,
      LocalPort,
      AccountName, 
      RegistryKey,
      RegistryKeyValueName,
      RegistryKeyValueData,
      InitiatingProcessCommandLine,
      ProcessCommandLine,
      AdditionalFields = tostring(AdditionalFields),
      SHA1,
      InitiatingProcessSHA1
      RemoteDeviceName
  | order by TimeGenerated asc
  | extend DetailBag = bag_pack(
              "Time", TimeGenerated,
              "File", FileName,
              "ProcessCommandLine", ProcessCommandLine,
              "RemoteUrl", RemoteUrl,
              "RemoteIP", RemoteIP,
              "RemotePort", tostring(RemotePort),
              "LocalIP", LocalIP, 
              "LocalPort", tostring(LocalPort), 
              "AccountName", AccountName, 
              "RegistryKey", RegistryKey,
              "RegistryKeyValueName", RegistryKeyValueName,
              "RegistryKeyValueData", RegistryKeyValueData,
              "Folder", FolderPath,
              "AdditionalFields", AdditionalFields,
              "FileSHA1", SHA1
  )
  | mv-apply k = bag_keys(DetailBag) on (
        where isnotempty(tostring(DetailBag[tostring(k)])) and 
        tostring(DetailBag[tostring(k)]) !in ("[]", "{}")
        | summarize DetailBag = make_bag(pack(tostring(k), DetailBag[tostring(k)]))
    )    
  | summarize 
      FirstEvent = min(TimeGenerated),
      LastEvent = max(TimeGenerated),
      Details = make_set(DetailBag)
      by 
      Actor,
      ActionType,
      InitiatingProcessFileName,
      InitiatingProcessSHA1,
      InitiatingProcessAccountName,
      InitiatingProcessParentFileName,
      InitiatingProcessCommandLine
  | order by FirstEvent asc
