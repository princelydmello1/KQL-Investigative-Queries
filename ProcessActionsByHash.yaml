name: Process and parent actions by file hash
description: |
  Query to find all actions performed by a process and its parent based on the file hash observed in an alert on a specific device. 
  This can be useful for a process alert in Defender, as that does not typically include this information. 
  This query can be used as a quick initial check to identify actions performed by a process before moving on to the timeline view, which is more time-consuming but has richer underlying data. 
  This query should be used to identify actions associated with a suspected malicious file that may have been invoked multiple times.
  This query will not return certain event types that are only visible in the Timeline View in Advanced Hunting. 
query:  |
  let alertSHA1 = "FIXME";
  let alertDeviceId = "FIXME";
  let startTime = ago(14d);
  let endTime = now();
  let ParentProcessSHA1 = 
      DeviceFileEvents
      | where TimeGenerated between (startTime .. endTime)
      | where SHA1 == alertSHA1 
          and DeviceId == alertDeviceId
      | summarize by InitiatingProcessSHA1;
  union 
      DeviceProcessEvents,
      DeviceNetworkEvents,
      DeviceFileEvents,
      DeviceRegistryEvents,
      DeviceLogonEvents,
      DeviceImageLoadEvents,
      DeviceEvents
      | where TimeGenerated between (startTime .. endTime)
  | where DeviceId == alertDeviceId 
      and (InitiatingProcessSHA1 == alertSHA1 or InitiatingProcessSHA1 has_any (ParentProcessSHA1))
  | extend Actor = case(
      InitiatingProcessSHA1 has_any (ParentProcessSHA1), "AlertProcessParent",
      InitiatingProcessSHA1 == alertSHA1, "AlertProcess",
      ""
  )
  | extend SuspEventType = case(
      (RegistryKey contains "Run" and ActionType == "RegistryValueSet") 
          or ProcessCommandLine has_any ("at", "net", "sc", "schtask") 
          or InitiatingProcessCommandLine has_any ("at", "net", "sc", "schtask") 
          or (FolderPath contains @"Microsoft\Windows\Start Menu\Programs\StartUp" and ActionType startswith "File"), "Persistence",
      ProcessCommandLine has_any ("wmi", "psexec", "bitsadmin") 
          or InitiatingProcessCommandLine has_any ("wmi", "psexec", "bitsadmin"), "Lateral Movement",
      ProcessCommandLine has_any ("netstat", "ping", "whoami") 
          or InitiatingProcessCommandLine has_any ("netstat", "ping", "whoami"), "Discovery",
      ProcessCommandLine has_any ("cmd", "powershell", "script", "mshta") 
          or InitiatingProcessCommandLine has_any ("cmd", "powershell", "script", "mshta"), "Execution",
      ""
  )
  | project-away 
      DeviceId,
      DeviceName,
      InitiatingProcessAccountDomain,
      InitiatingProcessAccountSid,
      InitiatingProcessIntegrityLevel,
      InitiatingProcessLogonId,
      InitiatingProcessMD5,
      InitiatingProcessSHA256,
      InitiatingProcessTokenElevation,
      InitiatingProcessFileSize,
      InitiatingProcessVersionInfoInternalFileName,
      MachineGroup,
      SHA256,
      InitiatingProcessSessionId,
      RequestAccountDomain,
      RequestAccountName,
      RequestAccountSid,
      RequestProtocol,
      InitiatingProcessVersionInfoProductVersion,
      ReportId,
      Timestamp,
      FileSize,
      InitiatingProcessParentCreationTime,
      InitiatingProcessCreationTime,
      TenantId,
      ProcessCreationTime,
      LogonId,
      LogonType,
      ProcessVersionInfoProductName,
      ProcessVersionInfoProductVersion,
      ProcessVersionInfoInternalFileName,
      InitiatingProcessSignerType,
      ProcessIntegrityLevel,
      ProcessTokenElevation,
      MD5,
      AccountObjectId,
      AccountSid,
      InitiatingProcessAccountObjectId,
      InitiatingProcessVersionInfoProductName,
      CreatedProcessSessionId,
      AccountDomain,
      AccountUpn,
      InitiatingProcessAccountUpn
  | project-reorder 
      SuspEventType,
      Actor,
      TimeGenerated,
      ActionType,
      InitiatingProcessFileName,
      InitiatingProcessCommandLine,
      FileName,
      ProcessCommandLine,
      RemoteUrl,
      RemoteIP,
      RemotePort,
      InitiatingProcessAccountName,
      InitiatingProcessParentFileName,
      AdditionalFields,
      InitiatingProcessSHA1,
      SHA1,
      Type
  | order by TimeGenerated asc nulls last
